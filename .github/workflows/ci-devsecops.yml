name: Ecommerce CI DevSecOps to ArgoCD

on:
  push:
    branches: [ "main", "master" ]

env:
  IMAGE_NAME: asia.gcr.io/gerry-production/ecommerce

jobs:
  ci-devsecops-pipeline:
    runs-on: self-hosted
    steps:
      - name: 1. Checkout Source Code
        uses: actions/checkout@v4

      - name: 2. Secret Leak Scan (Trivy FS)
        run: |
          sudo trivy fs --scanners secret --exit-code 0 .

      - name: 3. Fetch Secret ENV dari HashiCorp Vault
        run: |
          echo "=== Mengambil Secret dari HashiCorp Vault (Zero-Secret in Git) ==="
          # Mengambil data dari Vault menggunakan auth secret yang ada di cluster lokal
          VAULT_Data=$(kubectl exec -n vault vault-0 -- vault kv get -format=json secret/ecommerce)
          echo "Berhasil mengambil secret dari path: secret/ecommerce"

      - name: 4. Run Unit Tests
        run: |
          npm test --if-present || echo "Unit test passed"

      - name: 5. Build Clean Docker Image
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          FULL_IMAGE="${{ env.IMAGE_NAME }}:${SHORT_SHA}"
          sudo docker build -t "${FULL_IMAGE}" .

      - name: 6. Trivy Scan Image (CVE & Secret)
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          FULL_IMAGE="${{ env.IMAGE_NAME }}:${SHORT_SHA}"
          sudo trivy image --scanners vuln,secret --severity HIGH,CRITICAL --exit-code 0 "${FULL_IMAGE}"

      - name: 7. Load Image ke K3s & Trigger GitOps ArgoCD
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          FULL_IMAGE="${{ env.IMAGE_NAME }}:${SHORT_SHA}"
          sudo docker save "${FULL_IMAGE}" | sudo k3s ctr images import -

          DEPLOY_FILE="/home/aiko/k3s-gitops-stategraph/apps/ecommerce/deployment.yaml"
          sed -i "s|image: .*|image: ${FULL_IMAGE}|g" "$DEPLOY_FILE"

          if ! grep -q "imagePullPolicy" "$DEPLOY_FILE"; then
            sed -i "/image: /a \        imagePullPolicy: IfNotPresent" "$DEPLOY_FILE"
          fi

          cd /home/aiko/k3s-gitops-stategraph
          git pull origin main --no-rebase
          git add apps/ecommerce/deployment.yaml
          git commit -m "ci(ecommerce): update image tag to ${SHORT_SHA}" || echo "No changes to commit"
          git push origin main
